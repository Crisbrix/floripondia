<!--Hero de contacto-->
<section class="contact-hero">
  <h1>Contacto</h1>
  <p>Estamos a un mensaje de distancia</p>
</section>

<!--Tarjetas de contacto-->
<section class="contact-cards">
  @for (ch of channels; track ch.title; let i = $index) {
    <a [href]="ch.href" target="_blank" class="contact-card" [style.background]="ch.bg" [appReveal]="'up'" [revealDelay]="i * 120">
      <span class="contact-icon">
        <i [class]="ch.icon" style="font-size:28px;color:#555"></i>
      </span>
      <h3>{{ ch.title }}</h3>
      <span class="contact-link">{{ ch.link }}</span>
    </a>
  }
</section>

<!--Formulario de contacto-->
<section class="contact-form-section">
  <div class="form-card" [appReveal]="'flip'">
    <h2>Escríbenos</h2>
    <p>Cuéntanos qué buscas o si tienes alguna pregunta</p>
    <div class="contact-form">
      <input type="text" placeholder="Tu nombre" [(ngModel)]="nombre" />
      <input type="email" placeholder="Tu correo" [(ngModel)]="correo" />
      <textarea rows="4" placeholder="Escribe tu mensaje..." [(ngModel)]="mensaje"></textarea>
      <button type="button" class="flor-shine" (click)="enviarWhatsApp()">Enviar mensaje</button>
    </div>
  </div>
</section>
